document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"2cc63250-ceeb-49f8-969d-f3f1d95f1e5a\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* =========================================================================\n   Treble Design System — Base + Semantic Tokens\n   Reference: README.md (Visual Foundations)\n   ========================================================================= */\n\n@font-face {\n  font-family: \"Work Sans\";\n  src: url(\"d025ae87-da1a-4607-ab3b-7a5af5dd0830\") format(\"truetype-variations\");\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ---------- Fonts ---------- */\n  --font-sans: \"Work Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-display: \"Work Sans\", system-ui, sans-serif; /* same family, weight differentiates */\n\n  /* Weights */\n  --fw-regular: 400;\n  --fw-medium: 500;\n  --fw-semibold: 600;\n  --fw-black: 900;\n\n  /* ---------- Type scale (px — brand guide references pt; we map 1:1 for screen) ---------- */\n  --fs-headline: 80px;   /* Black, leading 1.05 */\n  --fs-subhead: 40px;    /* Semibold, leading 1.10 */\n  --fs-highlight: 30px;  /* Medium, leading 1.20 */\n  --fs-body: 15px;       /* Regular, leading 1.40 */\n  --fs-caption: 12px;    /* Regular, leading 1.30 */\n\n  /* Leadings */\n  --lh-headline: 1.05;\n  --lh-subhead: 1.10;\n  --lh-highlight: 1.20;\n  --lh-body: 1.40;\n  --lh-caption: 1.30;\n\n  /* Tracking — brand is neutral; leave default at normal */\n  --tracking-tight: -0.01em;\n  --tracking-normal: 0;\n\n  /* ---------- Primary palette (23% black + 23% gainsboro dominate) ---------- */\n  --black: #000000;\n  --gainsboro: #E7E7DC;\n  --white-smoke: #F2F6F2;\n  --light-steel-blue: #B39AFF;\n  --cornflower-blue: #6FB3E5;\n  --medium-aqua-marine: #82C7BF;\n  --golden-rod: #FAB52E;\n  --light-pink: #F3B2A8;\n\n  /* ---------- Secondary palette ---------- */\n  --rebecca-purple: #8423A8;\n  --navy: #003B7F;\n  --dark-slate-gray: #006046;\n  --saddle-brown: #634716;\n  --brown: #7E2954;\n\n  /* ---------- Accent palette (use sparingly) ---------- */\n  --medium-slate-blue: #7347FF;\n  --deep-sky-blue: #00A2E1;\n  --spring-green: #31EA7C;\n  --chocolate: #F8771D;\n  --fire-brick: #B01C5D;\n\n  /* ---------- Semantic color roles ---------- */\n  --bg-canvas: var(--white-smoke);\n  --bg-surface: #FFFFFF;\n  --bg-sunken: var(--gainsboro);\n  --bg-inverse: var(--black);\n\n  --fg-primary: var(--black);\n  --fg-secondary: rgba(0, 0, 0, 0.62);\n  --fg-tertiary: rgba(0, 0, 0, 0.42);\n  --fg-on-inverse: var(--white-smoke);\n  --fg-on-color: #FFFFFF;\n\n  --border-hairline: rgba(0, 0, 0, 0.08);\n  --border-strong: rgba(0, 0, 0, 0.16);\n  --border-on-inverse: rgba(255, 255, 255, 0.12);\n\n  --accent-primary: var(--black);      /* Primary CTAs are black */\n  --accent-secondary: var(--rebecca-purple);\n  --accent-success: var(--dark-slate-gray);\n  --accent-warning: var(--golden-rod);\n  --accent-danger: var(--fire-brick);\n  --accent-info: var(--cornflower-blue);\n\n  /* ---------- Elevation ---------- */\n  --shadow-0: none;\n  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.08);\n  --shadow-3: 0 24px 64px rgba(0, 0, 0, 0.14);\n\n  /* ---------- Radii ---------- */\n  --radius-xs: 6px;\n  --radius-sm: 10px;\n  --radius-md: 12px;   /* inputs, chips */\n  --radius-lg: 16px;   /* cards, large surfaces */\n  --radius-xl: 24px;   /* feature cards, hero modules */\n  --radius-pill: 999px;\n\n  /* ---------- Spacing (4px base) ---------- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-14: 56px;\n  --space-18: 72px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ---------- Motion ---------- */\n  --ease-standard: cubic-bezier(0.2, 0.8, 0.2, 1);\n  --dur-micro: 120ms;\n  --dur-small: 180ms;\n  --dur-panel: 240ms;\n\n  /* ---------- Layout ---------- */\n  --container-max: 1140px;\n  --page-padding: 32px;\n}\n\n/* =========================================================================\n   Semantic element styles — apply to bare HTML for default Treble-brand look\n   ========================================================================= */\n\nhtml, body {\n  background: var(--bg-canvas);\n  color: var(--fg-primary);\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  font-weight: var(--fw-regular);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, .h-headline {\n  font-family: var(--font-display);\n  font-weight: var(--fw-black);\n  font-size: var(--fs-headline);\n  line-height: var(--lh-headline);\n  letter-spacing: var(--tracking-tight);\n  margin: 0;\n  text-wrap: balance;\n}\n\nh2, .h-subhead {\n  font-family: var(--font-display);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-subhead);\n  line-height: var(--lh-subhead);\n  margin: 0;\n  text-wrap: balance;\n}\n\nh3, .h-highlight {\n  font-family: var(--font-display);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-highlight);\n  line-height: var(--lh-highlight);\n  margin: 0;\n}\n\nh4 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: 20px;\n  line-height: 1.25;\n  margin: 0;\n}\n\nh5 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: 16px;\n  line-height: 1.3;\n  margin: 0;\n}\n\np, .body {\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--fg-primary);\n  text-wrap: pretty;\n}\n\nsmall, .caption {\n  font-size: var(--fs-caption);\n  line-height: var(--lh-caption);\n  color: var(--fg-secondary);\n}\n\na {\n  color: inherit;\n  text-decoration: none;\n  border-bottom: 1px solid currentColor;\n  transition: opacity var(--dur-small) var(--ease-sta 02Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:24px\">\n\n      <div style=\"background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:16px; padding:24px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px\">\n          <div style=\"display:flex; align-items:center; gap:10px\">\n            <span style=\"width:22px; height:22px; border-radius:999px; background:#000; color:#F2F6F2; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center\">2<\u002Fspan>\n            <span style=\"font-size:16px; font-weight:600\">Agent and bot conversations<\u002Fspan>\n          <\u002Fdiv>\n          <div id=\"bucketPriceOut\" style=\"font-size:20px; font-weight:900; letter-spacing:-0.01em; font-variant-numeric:tabular-nums\">$0.00/mo<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:10px; margin:14px 0 18px\">\n          <span id=\"bucketConvosBig\" style=\"font-size:30px; font-weight:900; letter-spacing:-0.01em; line-height:1; font-variant-numeric:tabular-nums\">0<\u002Fspan>\n          <span style=\"font-size:13px; font-weight:500; color:rgba(0,0,0,.62)\">conversations / mo<\u002Fspan>\n          <span id=\"bucketFreeNote\" style=\"margin-left:auto; font-size:12px; font-weight:500; color:rgba(0,0,0,.62); background:var(--gainsboro); border-radius:999px; padding:5px 12px\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative; padding-top:6px\">\n          <input type=\"range\" id=\"bucketSlider\" min=\"0\" max=\"12\" step=\"1\" sc-camel-default-value=\"1\" sc-camel-on-input=\"{{ onBucketChange }}\">\n          <div id=\"bucketTicks\" style=\"position:relative; height:18px; margin-top:8px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:16px; padding:24px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px\">\n          <div style=\"display:flex; align-items:center; gap:10px\">\n            <span style=\"width:22px; height:22px; border-radius:999px; background:#000; color:#F2F6F2; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center\">3<\u002Fspan>\n            <span style=\"font-size:16px; font-weight:600\">AI conversations<\u002Fspan>\n          <\u002Fdiv>\n          <div id=\"aiBucketPriceOut\" style=\"font-size:20px; font-weight:900; letter-spacing:-0.01em; font-variant-numeric:tabular-nums\">$0.00/mo<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:10px; margin:14px 0 18px\">\n          <span id=\"aiBucketConvosBig\" style=\"font-size:30px; font-weight:900; letter-spacing:-0.01em; line-height:1; font-variant-numeric:tabular-nums\">0<\u002Fspan>\n          <span style=\"font-size:13px; font-weight:500; color:rgba(0,0,0,.62)\">AI conversations / mo<\u002Fspan>\n          <span id=\"aiBucketFreeNote\" style=\"margin-left:auto; font-size:12px; font-weight:500; color:rgba(0,0,0,.62); background:var(--gainsboro); border-radius:999px; padding:5px 12px\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative; padding-top:6px\">\n          <input type=\"range\" id=\"aiBucketSlider\" min=\"0\" max=\"17\" step=\"1\" sc-camel-default-value=\"0\" sc-camel-on-input=\"{{ onAiBucketChange }}\">\n          <div id=\"aiBucketTicks\" style=\"position:relative; height:18px; margin-top:8px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div class=\"total-box\" style=\"background:#000; color:#F2F6F2; border-radius:16px; display:grid; grid-template-columns:1fr auto auto; align-items:baseline; column-gap:16px; row-gap:8px; padding:28px 32px\">\n      <div style=\"display:contents\">\n        <span style=\"grid-column:1; font-size:15px; color:rgba(255,255,255,.62)\">Tier<\u002Fspan>\n        <span id=\"lineTier\" style=\"grid-column:2; font-size:15px; color:rgba(255,255,255,.9); text-align:right; font-variant-numeric:tabular-nums\">$0.00<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:contents\">\n        <span style=\"grid-column:1; font-size:15px; color:rgba(255,255,255,.62)\">Conversation bucket <span id=\"lineBucketConvos\" style=\"font-size:12px; color:rgba(255,255,255,.42)\"><\u002Fspan><\u002Fspan>\n        <span id=\"lineBucket\" style=\"grid-column:2; font-size:15px; color:rgba(255,255,255,.9); text-align:right; font-variant-numeric:tabular-nums\">$0.00<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:contents\">\n        <span style=\"grid-column:1; font-size:15px; color:rgba(255,255,255,.62)\">AI conversation bucket <span id=\"lineAiBucketConvos\" style=\"font-size:12px; color:rgba(255,255,255,.42)\"><\u002Fspan><\u002Fspan>\n        <span id=\"lineAiBucket\" style=\"grid-column:2; font-size:15px; color:rgba(255,255,255,.9); text-align:right; font-variant-numeric:tabular-nums\">$0.00<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:1 / -1; border-top:1px solid rgba(255,255,255,.12); margin:10px 0\"><\u002Fdiv>\n      <div style=\"display:contents\">\n        <span style=\"grid-column:1; font-size:24px; font-weight:900; letter-spacing:-0.01em; color:#fff\">Total<\u002Fspan>\n        <span style=\"grid-column:2; text-align:right\">\n          <span id=\"grandTotalOut\" style=\"font-size:24px; font-weight:900; letter-spacing:-0.01em; color:#fff; font-variant-numeric:tabular-nums\">$0.00<\u002Fspan>\n        <\u002Fspan>\n        <span id=\"grandTotalMetaFee\" sc-camel-on-click=\"{{ toggleDrawer }}\" style=\"grid-column:3; font-size:14px; font-weight:500; color:rgba(255,255,255,.5); margin-left:8px; cursor:pointer; border-bottom:1px dotted rgba(255,255,255,.4); padding-bottom:2px\" style-hover=\"color:rgba(255,255,255,.9)\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"grid-column:1 / -1; margin-top:14px; font-size:12px; color:rgba(255,255,255,.5)\">Includes onboarding and a dedicated CSM. AI allowance is a share of your bot volume.<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div id=\"backdrop\" sc-camel-on-click=\"{{ toggleDrawer }}\" style=\"position:fixed; inset:0; background:rgba(0,0,0,0.45); opacity:{{ backdropOpacity }}; pointer-events:{{ drawerEvents }}; transition:opacity 240ms cubic-bezier(.2,.8,.2,1); z-index:40\"><\u002Fdiv>\n\n  <div id=\"metaDrawer\" style=\"position:fixed; left:24px; right:24px; bottom:0; max-width:960px; margin:0 auto; background:#fff; border:1px solid rgba(0,0,0,0.08); border-bottom:none; border-radius:16px 16px 0 0; box-shadow:0 24px 64px rgba(0,0,0,0.14); z-index:50; max-height:64vh; transform:{{ drawerTransform }}; opacity:{{ drawerOpacity }}; pointer-events:{{ drawerEvents }}; transition:transform 240ms cubic-bezier(.2,.8,.2,1), opacity 180ms cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column\">\n    <div sc-camel-on-click=\"{{ toggleDrawer }}\" style=\"height:56px; flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; font-size:15px; font-weight:600; color:#000\">\n      <span id=\"drawerArrow\" style=\"display:inline-block; transform:{{ arrowTransform }}; transition:transform 240ms cubic-bezier(.2,.8,.2,1); color:rgba(0,0,0,.42); font-size:11px\">▲<\u002Fspan>\n      Meta fees\n      <span style=\"color:#7347FF; font-weight:600\">$<span id=\"metaFeeTabOut\">0.00<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"overflow-y:auto; padding:8px 32px 28px; border-top:1px solid rgba(0,0,0,0.08)\">\n      <div id=\"metaRows\"><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ addRow }}\" style=\"margin-top:14px; font-family:'Work Sans',sans-serif; font-size:13px; font-weight:500; color:#000; background:none; border:1px dashed rgba(0,0,0,0.24); padding:9px 16px; border-radius:999px; cursor:pointer; transition:background 180ms cubic-bezier(.2,.8,.2,1)\" style-hover=\"background:rgba(0,0,0,0.04)\">Add country<\u002Fbutton>\n      <div style=\"margin-top:20px; padding-top:16px; border-top:1px solid rgba(0,0,0,0.08); font-size:14px; font-weight:500; color:rgba(0,0,0,.62)\">Meta fee subtotal: <span id=\"metaFeeOut\" style=\"color:#000; font-weight:600; font-variant-numeric:tabular-nums\">$0.00<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { drawerOpen: false };\n  componentDidMount(){\n    this.styleEl = document.createElement('style');\n    this.styleEl.textContent = `\n      .tier-card.selected{ border-color:#000 !important; box-shadow:0 0 0 2px #000; }\n      .tier-card.selected .check-badge{ display:flex !important; }\n    `;\n    document.head.appendChild(this.styleEl);\n    this.boot();\n  }\n  /* Mirrors the receipt's \"(N convos w/ M free)\" note next to each slider and\n     marks the active tick. Read-only: wraps the sync fns, never changes pricing. */\n  attachIndicators(){\n    const mirror = (srcId, bigId, noteId, sliderId) => {\n      const src = document.getElementById(srcId);\n      const big = document.getElementById(bigId);\n      const note = document.getElementById(noteId);\n      const slider = document.getElementById(sliderId);\n      if(!src || !big || !note) return;\n      const m = (src.textContent || '').match(/^\\((.+?) convos w\\/ (.+?) free\\)$/);\n      if(m){ big.textContent = m[1]; note.textContent = m[2] + ' free'; }\n      const ticks = slider && slider.parentElement.querySelectorAll('.tick');\n      if(ticks){\n        const idx = parseInt(slider.value, 10);\n        ticks.forEach((t, i) => {\n          const on = i === idx;\n          t.querySelector('.tlabel').style.color = on ? '#000' : 'rgba(0,0,0,.42)';\n          t.querySelector('.tlabel').style.fontWeight = on ? '600' : '500';\n          t.querySelector('.dash').style.background = on ? '#000' : 'rgba(0,0,0,0.24)';\n          t.querySelector('.dash').style.height = on ? '9px' : '5px';\n        });\n      }\n    };\n    const refresh = () => {\n      mirror('lineBucketConvos', 'bucketConvosBig', 'bucketFreeNote', 'bucketSlider');\n      mirror('lineAiBucketConvos', 'aiBucketConvosBig', 'aiBucketFreeNote', 'aiBucketSlider');\n    };\n    this.refreshIndicators = refresh;\n    refresh();\n  }\n  boot(){\n    if(window.__pricingInit){ this.attachIndicators(); window.__pricingInit(); this.attachIndicators(); return; }\n    this.t = setTimeout(() => this.boot(), 60);\n  }\n  componentWillUnmount(){\n    clearTimeout(this.t);\n    if(this.styleEl) this.styleEl.remove();\n  }\n  renderVals(){\n    const call = (name, ...args) => () => {\n      if(window[name]) window[name](...args);\n      if(this.refreshIndicators) this.refreshIndicators();\n    };\n    const open = !!this.state.drawerOpen;\n    return {\n      drawerTransform: open ? 'translateY(0)' : 'translateY(100%)',\n      drawerOpacity: open ? 1 : 0,\n      drawerEvents: open ? 'auto' : 'none',\n      backdropOpacity: open ? 1 : 0,\n      arrowTransform: open ? 'rotate(180deg)' : 'rotate(0deg)',\n      toggleDrawer: () => {\n        if(window.toggleDrawer) window.toggleDrawer();\n        this.setState(s => ({ drawerOpen: !s.drawerOpen }));\n      },\n      selectStarter: call('selectTier', 'starter'),\n      selectPro: call('selectTier', 'pro'),\n      selectAdvanced: call('selectTier', 'advanced'),\n      selectEnterprise: call('selectTier', 'enterprise'),\n      onBucketChange: call('onBucketChange'),\n      onAiBucketChange: call('onAiBucketChange'),\n      addRow: call('addRow')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
