<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treble Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!--
  ============================================================================
  TREBLE PRICING -- redesigned for live call narration
  ============================================================================
  Design brief: a rep types the two numbers a prospect just gave them on a
  call, hits one button, and the plan arrives the way this product actually
  delivers value -- as a message. The signature move is a real WhatsApp-style
  bubble reveal (typing dots, then the bubble lands with a read receipt).
  Everything else stays quiet: a plain recap line, a plain receipt, and a
  manual-adjust panel that's collapsed until asked for.

  Per standing instruction: no per-conversation or per-credit rate is shown
  anywhere -- only flat tier and bucket prices.
  ============================================================================
-->

<style>
  :root{
    --paper: #F6F7F4;
    --ink: #10241F;
    --ink-soft: #566860;
    --ink-faint: #9AA9A2;
    --border: #E1E6E1;
    --white: #FFFFFF;
    --accent: #0C7C59;
    --accent-dark: #0A6B4C;
    --accent-bright: #1FAE6C;
    --accent-pale: #E4F3EA;
    --font-display: 'Fraunces', serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --radius: 20px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background: var(--paper);
    font-family: var(--font-body);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding: 56px 20px 120px;
  }
  .stage{ max-width: 560px; margin: 0 auto; }

  /* ---------------------------------------------------------------- masthead */
  .masthead{
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 36px;
  }
  .masthead .dot{ width: 7px; height: 7px; border-radius: 50%; background: var(--accent-bright); }

  /* ---------------------------------------------------------------- composer */
  .composer-fields{ display: flex; gap: 12px; margin-bottom: 16px; }
  .field{ flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .field-label{
    font-size: 12px; font-weight: 600; color: var(--ink-soft);
  }
  .field input{
    font-family: var(--font-mono); font-size: 16px; color: var(--ink);
    background: var(--white); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 13px 14px; outline: none; transition: border-color .15s;
    width: 100%;
  }
  .field input::placeholder{ color: var(--ink-faint); font-family: var(--font-body); }
  .field input:focus{ border-color: var(--accent); }

  .send-btn{
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; font-family: var(--font-body); font-weight: 700; font-size: 15px;
    color: #fff; background: var(--accent); border: none; border-radius: 12px;
    padding: 14px; cursor: pointer; transition: background .15s, transform .1s;
  }
  .send-btn:hover{ background: var(--accent-dark); }
  .send-btn:active{ transform: scale(0.99); }
  .send-btn svg{ width: 16px; height: 16px; }

  .every-plan{
    background: var(--accent-pale); border-radius: 16px; padding: 18px 20px;
    margin-bottom: 24px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px 18px;
  }
  .every-plan .ep-title{
    grid-column: 1 / -1; font-family: var(--font-display); font-weight: 600; font-size: 16px;
    color: var(--ink); margin-bottom: 2px;
  }
  .every-plan .ep-item{
    display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .every-plan .ep-item::before{
    content: '\2713'; flex-shrink: 0; width: 17px; height: 17px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }

  @media (max-width: 480px){
    .every-plan{ grid-template-columns: 1fr; }
  }

  /* ---------------------------------------------------------------- recap bar */
  .recap-bar{
    display: none; align-items: baseline; justify-content: space-between;
    margin: 28px 0 18px; font-size: 13px; color: var(--ink-soft);
  }
  .recap-bar.show{ display: flex; }
  .recap-bar .recap-text b{ color: var(--ink); font-weight: 700; }
  .edit-link{
    font-family: var(--font-body); font-size: 12.5px; font-weight: 700; color: var(--accent);
    background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline;
    text-decoration-color: var(--accent-pale);
  }

  /* ---------------------------------------------------------------- typing dots */
  .typing-indicator{
    display: none; align-items: center; gap: 4px;
    width: fit-content; background: var(--white); border: 1.5px solid var(--border);
    border-radius: 18px; padding: 12px 16px; margin-bottom: 14px;
  }
  .typing-indicator.show{ display: flex; }
  .typing-indicator span{
    width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(2){ animation-delay: .15s; }
  .typing-indicator span:nth-child(3){ animation-delay: .3s; }
  @keyframes bounce{ 0%,60%,100%{ transform: translateY(0); opacity:.5; } 30%{ transform: translateY(-4px); opacity:1; } }

  /* ---------------------------------------------------------------- bubble */
  .bubble-wrap{ display: flex; justify-content: flex-end; margin: 6px 0 22px; }
  .bubble-wrap.hidden-init{ display: none; }
  .bubble{
    position: relative; background: var(--accent); color: #fff;
    border-radius: 18px 18px 4px 18px; padding: 22px 24px 18px;
    max-width: 92%; box-shadow: 0 10px 28px rgba(12,124,89,.22);
    opacity: 0; transform: translateY(10px);
  }
  .bubble.landed{
    animation: land .38s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes land{ to{ opacity: 1; transform: translateY(0); } }
  .bubble::after{
    content: ''; position: absolute; bottom: 0; right: -7px; width: 16px; height: 16px;
    background: var(--accent); clip-path: polygon(0 0, 0% 100%, 100% 100%);
  }
  .bubble-tier{
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: rgba(255,255,255,.72); margin-bottom: 6px;
  }
  .bubble-price{
    font-family: var(--font-display); font-weight: 600; font-size: 40px;
    letter-spacing: -0.01em; line-height: 1; margin-bottom: 4px;
  }
  .bubble-price .per{ font-family: var(--font-body); font-size: 15px; font-weight: 600; color: rgba(255,255,255,.65); }
  .bubble-includes{ list-style: none; margin: 14px 0 4px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .bubble-includes li{
    font-size: 13.5px; color: rgba(255,255,255,.92); display: flex; align-items: baseline; gap: 7px;
  }
  .bubble-includes li::before{ content: '\2713'; font-weight: 700; color: rgba(255,255,255,.6); }
  .bubble-includes li.divider{
    height: 1px; background: rgba(255,255,255,.22); padding: 0; margin: 4px 0 2px;
  }
  .bubble-includes li.divider::before{ content: none; }
  .bubble-meta{
    display: flex; justify-content: flex-end; align-items: center; gap: 4px;
    margin-top: 12px; font-size: 11px; color: rgba(255,255,255,.55);
  }
  .bubble-meta svg{ width: 14px; height: 9px; }

  /* ---------------------------------------------------------------- receipt & expandable line items */
  .receipt{ display: none; padding: 4px 4px 0; }
  .receipt.show{ display: block; }

  .line-item{ border-bottom: 1px solid var(--border); }
  .line-header{
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 11px 2px; cursor: pointer; font-size: 13.5px; color: var(--ink-soft);
  }
  .line-header .line-main{ flex: 1; }
  .line-right{ display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .line-header .amt{ font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
  .line-header .sub{ font-size: 11.5px; color: var(--ink-faint); }
  .line-chev{ width: 11px; height: 11px; color: var(--ink-faint); transition: transform .2s; flex-shrink: 0; }
  .line-item.open .line-chev{ transform: rotate(180deg); }
  .line-item.open .line-header{ color: var(--ink); }

  .line-expand{
    display: none; padding: 2px 2px 18px; animation: expandIn .18s ease;
  }
  .line-item.open .line-expand{ display: block; }
  @keyframes expandIn{ from{ opacity: 0; transform: translateY(-4px); } to{ opacity: 1; transform: translateY(0); } }

  .receipt-line{
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 13.5px; color: var(--ink-soft);
  }
  .receipt-line .amt{ font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
  .receipt-line .sub{ font-size: 11.5px; color: var(--ink-faint); }
  .receipt-total{
    display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 0;
  }
  .receipt-total .label{ font-family: var(--font-display); font-weight: 600; font-size: 16px; }
  .total-amt-wrap{ display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .total-amt-wrap .amt{ font-family: var(--font-mono); font-weight: 600; font-size: 20px; color: var(--accent-dark); }
  .meta-note{
    font-size: 11.5px; color: var(--ink-faint); cursor: pointer;
    display: inline-flex; align-items: baseline; gap: 3px;
  }
  .meta-note:hover{ color: var(--accent-dark); text-decoration: underline; }
  .meta-note #metaNoteAmt{ font-family: var(--font-mono); font-weight: 600; }

  /* ---------------------------------------------------------------- Meta Fees drawer */
  .backdrop{
    position: fixed; inset: 0; background: rgba(16,36,31,.45);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 40;
  }
  .backdrop.open{ opacity: 1; pointer-events: auto; }
  .drawer{
    position: fixed; left: 24px; right: 24px; bottom: 0; max-width: 960px; margin: 0 auto;
    background: var(--white); border: 1.5px solid var(--border); border-bottom: none;
    border-radius: 18px 18px 0 0; box-shadow: 0 -10px 28px rgba(16,36,31,.14);
    z-index: 50; max-height: 66vh; transform: translateY(100%); opacity: 0; pointer-events: none;
    transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .2s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open{ transform: translateY(0); opacity: 1; pointer-events: auto; }
  .drawer-handle{
    height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    gap: 9px; cursor: pointer; font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--ink);
  }
  .drawer-arrow{ display: inline-block; transition: transform .35s ease; color: var(--ink-faint); font-size: 11px; }
  .drawer.open .drawer-arrow{ transform: rotate(180deg); }
  .drawer-summary{ color: var(--accent-dark); }
  .drawer-body{ overflow-y: auto; padding: 4px 26px 22px; border-top: 1px solid var(--border); }
  .drawer-subtotal{
    margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border);
    font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--ink);
  }
  .drawer-subtotal span{ color: var(--accent-dark); font-weight: 700; }
  .meta-row{ display: flex; align-items: center; gap: 12px; padding: 10px 0; flex-wrap: nowrap; }
  .meta-row + .meta-row{ border-top: 1px dashed var(--border); }
  .country-select, .category-select{
    flex: 0 0 150px; padding: 8px 9px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 12px; font-family: var(--font-body); color: var(--ink); background: var(--paper);
  }
  .row-slider-wrap{ flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
  .row-slider-wrap input[type="range"]{
    flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; background: var(--border); outline: none;
  }
  .row-slider-wrap input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 3px 8px rgba(12,124,89,.35); cursor: pointer;
  }
  .row-value{ font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink); min-width: 90px; text-align: right; flex-shrink: 0; }
  .row-price{ font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--accent-dark); min-width: 56px; text-align: right; flex-shrink: 0; }
  .row-remove{
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--white); color: var(--ink-faint); font-size: 14px; line-height: 1; cursor: pointer; padding: 0;
  }
  .row-remove:hover{ background: var(--paper); color: var(--ink); }
  .add-row{
    margin-top: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--accent-dark);
    background: none; border: 1px dashed var(--accent-pale); padding: 7px 12px; border-radius: 999px; cursor: pointer;
  }
  .add-row:hover{ background: var(--accent-pale); }

  /* ---------------------------------------------------------------- Tier cards (inside the Tier line's expand) */
  .tier-cards{ display: flex; flex-direction: column; gap: 8px; }
  .tier-card2{
    display: flex; justify-content: space-between; align-items: center;
    border: 1.5px solid var(--border); border-radius: 12px; padding: 11px 14px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .tier-card2:hover{ border-color: #C9E4D5; }
  .tier-card2.active{ border-color: var(--accent); background: var(--accent-pale); }
  .tier-card2 .t-left{ display: flex; align-items: baseline; gap: 10px; }
  .tier-card2 .t-name{ font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--ink); }
  .tier-card2 .t-includes{ font-size: 11px; color: var(--ink-faint); }
  .tier-card2.active .t-includes{ color: var(--accent-dark); }
  .tier-card2 .t-price{ font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--ink); flex-shrink: 0; }

  /* ---------------------------------------------------------------- bucket steppers & agent stepper */
  .stepper-row{
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 2px; font-size: 12.5px; color: var(--ink-soft);
  }
  .stepper-row .sr-size{ font-family: var(--font-mono); font-weight: 600; color: var(--ink); }
  .stepper{ display: flex; align-items: center; gap: 8px; }
  .stepper button{
    width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--border);
    background: var(--white); color: var(--accent); font-weight: 700; cursor: pointer; line-height: 1;
  }
  .stepper .qty{ font-family: var(--font-mono); font-weight: 700; font-size: 12.5px; width: 14px; text-align: center; }

  input[type="range"]{
    width: 100%; height: 4px; border-radius: 999px; background: var(--border);
    outline: none; -webkit-appearance: none; appearance: none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 3px 8px rgba(12,124,89,.35); cursor: pointer;
  }
  .ai-slider-label{ display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; }
  .ai-slider-label .val{ font-family: var(--font-mono); font-weight: 700; color: var(--accent-dark); }

  @media (prefers-reduced-motion: reduce){
    .bubble{ opacity: 1; transform: none; animation: none; }
    .typing-indicator span{ animation: none; opacity: .7; }
  }

  @media (max-width: 480px){
    .composer-fields{ flex-direction: column; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="masthead"><span class="dot"></span>Treble Pricing</div>

  <!-- ============================== COMPOSER ============================== -->
  <div id="composerBlock">
    <div class="every-plan" id="everyPlanNote"></div>
    <div class="composer-fields">
      <label class="field">
        <span class="field-label">Conversations, monthly</span>
        <input type="number" id="inConvos" min="0" step="500" placeholder="e.g. 32,000">
      </label>
      <label class="field">
        <span class="field-label">AI credits, monthly</span>
        <input type="number" id="inAi" min="0" step="100" placeholder="e.g. 3,000">
      </label>
      <label class="field">
        <span class="field-label">Human agents</span>
        <input type="number" id="inAgents" min="0" step="1" placeholder="e.g. 35">
      </label>
    </div>
    <button class="send-btn" onclick="showPlan()">
      <span>Show plan</span>
    </button>
  </div>

  <!-- ============================== RECAP ============================== -->
  <div class="recap-bar" id="recapBar">
    <span class="recap-text" id="recapText"></span>
    <button class="edit-link" onclick="editInputs()">Edit</button>
  </div>

  <!-- ============================== TYPING + BUBBLE ============================== -->
  <div class="typing-indicator" id="typingIndicator"><span></span><span></span><span></span></div>

  <div class="bubble-wrap hidden-init" id="bubbleWrap">
    <div class="bubble" id="bubble">
      <div class="bubble-tier" id="bubbleTier"></div>
      <div class="bubble-price" id="bubblePrice"></div>
      <ul class="bubble-includes" id="bubbleIncludes"></ul>
      <div class="bubble-meta">
        <span>Just now</span>
        <svg viewBox="0 0 16 10" fill="none"><path d="M1 5.5 4 8.5 9.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 5.5 9.5 8.5 15 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>

  <!-- ============================== RECEIPT (each line expands in place) ============================== -->
  <div class="receipt" id="receiptBlock">

    <div class="line-item" id="lineitem-tier">
      <div class="line-header" onclick="toggleLine('tier')">
        <span class="line-main">Tier <span class="sub" id="lineTierSub"></span></span>
        <span class="line-right"><span class="amt" id="lineTierPrice"></span><svg class="line-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="line-expand">
        <div class="tier-cards" id="tierCards"></div>
      </div>
    </div>

    <div class="line-item" id="lineitem-convo">
      <div class="line-header" onclick="toggleLine('convo')">
        <span class="line-main">Additional conversations <span class="sub" id="lineConvoSub"></span></span>
        <span class="line-right"><span class="amt" id="lineConvoPrice"></span><svg class="line-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="line-expand">
        <div id="stepperList"></div>
      </div>
    </div>

    <div class="line-item" id="lineitem-ai">
      <div class="line-header" onclick="toggleLine('ai')">
        <span class="line-main">Additional AI credits <span class="sub" id="lineAiSub"></span></span>
        <span class="line-right"><span class="amt" id="lineAiPrice"></span><svg class="line-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="line-expand">
        <input type="range" id="aiSlider" min="0" max="17" step="1" value="0" oninput="onAiSliderInput()">
        <div class="ai-slider-label"><span>Additional AI credits</span><span class="val" id="aiSliderVal">0</span></div>
      </div>
    </div>

    <div class="line-item" id="lineitem-agents">
      <div class="line-header" onclick="toggleLine('agents')">
        <span class="line-main">Additional human agents <span class="sub" id="lineAgentsSub"></span></span>
        <span class="line-right"><span class="amt" id="lineAgentsPrice"></span><svg class="line-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="line-expand">
        <div class="stepper-row">
          <span>Additional human agents <span style="color:var(--ink-faint);">&middot; $50 each</span></span>
          <div class="stepper">
            <button type="button" onclick="stepAgents(-1)">&minus;</button>
            <span class="qty" id="qty-agents">0</span>
            <button type="button" onclick="stepAgents(1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="receipt-total">
      <span class="label">Total</span>
      <div class="total-amt-wrap">
        <span class="amt" id="totalOut"></span>
        <div class="meta-note" onclick="toggleDrawer()">+ <span id="metaNoteAmt">$0</span> Meta fees</div>
      </div>
    </div>
  </div>


</div>

<!-- ============================== META FEES DRAWER ============================== -->
<div class="backdrop" id="backdrop" onclick="toggleDrawer()"></div>
<div class="drawer" id="metaDrawer">
  <div class="drawer-handle" onclick="toggleDrawer()">
    <span class="drawer-arrow" id="drawerArrow">&#9650;</span>
    Meta pass-through fees
    <span class="drawer-summary">$<span id="metaFeeTabOut">0.00</span></span>
  </div>
  <div class="drawer-body">
    <div id="metaRows"></div>
    <button class="add-row" onclick="addRow()">+ Add market</button>
    <div class="drawer-subtotal">Meta subtotal: <span id="metaFeeOut">$0.00</span></div>
  </div>
</div>

<script>
/* ============================================================================
   DATA -- flat tier and bucket prices only.
   ============================================================================ */
const TIERS = [
  { id: 't1', label: 'T1', convos: 5000,   price: 399,  aiCredits: 300,   agents: 10 },
  { id: 't2', label: 'T2', convos: 15000,  price: 799,  aiCredits: 1500,  agents: 20 },

function fmtInt(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtMoney(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
/** Compact form for tight spaces: 12500 -> "12.5k", 900 -> "900" */
function fmtK(n){
  if(n >= 1000){
    const k = n / 1000;
    return (k % 1 === 0 ? k.toFixed(0) : k.toFixed(1)) + 'k';
  }
  return String(Math.round(n));
}

/* ============================================================================
   BEST-FIT SOLVER (unbounded-coin DP for buckets, min-step lookup for AI)
   ============================================================================ */
function cheapestConvoBuckets(gap){
  const counts = {};
  CONVO_BUCKETS.forEach(b => counts[b.size] = 0);
  if(gap <= 0) return { cost: 0, counts };
  const unit = 1000;
  const gapUnits = Math.ceil(gap / unit);
  const coins = CONVO_BUCKETS.map(b => ({ units: b.size / unit, price: b.price, size: b.size }));
  const minCost = new Array(gapUnits + 1).fill(Infinity);
  const choice = new Array(gapUnits + 1).fill(null);
  minCost[0] = 0;
  for(let i = 1; i <= gapUnits; i++){
    coins.forEach(c => {
      const prevIdx = Math.max(0, i - c.units);
      const cost = minCost[prevIdx] + c.price;
      if(cost < minCost[i]){ minCost[i] = cost; choice[i] = c; }
    });
  }
  let i = gapUnits;
  while(i > 0){
    const c = choice[i];
    counts[c.size] = (counts[c.size] || 0) + 1;
    i = Math.max(0, i - c.units);
  }
  return { cost: minCost[gapUnits], counts };
}

function cheapestAiStepIdx(gap){
  if(gap <= 0) return 0;
  for(let i = 0; i < AI_STEPS.length; i++){ if(AI_STEPS[i] >= gap) return i; }
  return AI_STEPS.length - 1;
}

/* ============================================================================
   FLOW: composer -> typing -> bubble -> receipt -> (optional) manual adjust
   ============================================================================ */
function showPlan(){
  const convosNeeded = parseFloat(document.getElementById('inConvos').value) || 0;
  const aiNeeded = parseFloat(document.getElementById('inAi').value) || 0;
  const agentsNeeded = parseFloat(document.getElementById('inAgents').value) || 0;

  let best = null;
  TIERS.forEach(tier => {
    const convoGap = Math.max(0, convosNeeded - tier.convos);
    const convoResult = cheapestConvoBuckets(convoGap);
    const aiGap = Math.max(0, aiNeeded - tier.aiCredits);
    const aiIdxCandidate = cheapestAiStepIdx(aiGap);
    const aiCostCandidate = AI_PRICE[AI_STEPS[aiIdxCandidate]] || 0;
    const agentGap = Math.max(0, agentsNeeded - tier.agents);
    const agentCostCandidate = agentGap * AGENT_PRICE;
    const totalCost = tier.price + convoResult.cost + aiCostCandidate + agentCostCandidate;
    if(!best || totalCost < best.totalCost){
      best = { tier, convoResult, aiIdxCandidate, aiCostCandidate, agentGap, agentCostCandidate, totalCost };
    }
  });

  selectedTierId = best.tier.id;
  CONVO_BUCKETS.forEach(b => convoQty[b.size] = best.convoResult.counts[b.size] || 0);
  aiIdx = best.aiIdxCandidate;
  agentsQty = best.agentGap;

  // Recap bar
  const recap = document.getElementById('recapBar');
  document.getElementById('recapText').innerHTML = `<b>${fmtInt(convosNeeded)}</b> conversations &middot; <b>${fmtInt(aiNeeded)}</b> AI credits &middot; <b>${fmtInt(agentsNeeded)}</b> human agents / mo`;
  recap.classList.add('show');
  document.getElementById('composerBlock').style.display = 'none';

  // Typing indicator, then bubble lands
  const typing = document.getElementById('typingIndicator');
  const bubbleWrap = document.getElementById('bubbleWrap');
  const bubble = document.getElementById('bubble');
  bubbleWrap.classList.remove('hidden-init');
  bubbleWrap.style.display = 'none';
  bubble.classList.remove('landed');
  typing.classList.add('show');

  renderTierCards();
  renderConvoBuckets();
  document.getElementById('qty-agents').textContent = agentsQty;
  syncAiSliderUI();
  updateAll();

  setTimeout(() => {
    typing.classList.remove('show');
    bubbleWrap.style.display = 'flex';
    void bubble.offsetWidth; // restart animation
    bubble.classList.add('landed');
    document.getElementById('receiptBlock').classList.add('show');
  }, 650);
}

function editInputs(){
  document.getElementById('composerBlock').style.display = 'block';
  document.getElementById('recapBar').classList.remove('show');
  document.getElementById('typingIndicator').classList.remove('show');
  document.getElementById('bubbleWrap').classList.add('hidden-init');
  document.getElementById('bubbleWrap').style.display = 'none';
  document.getElementById('bubble').classList.remove('landed');
  document.getElementById('receiptBlock').classList.remove('show');
  ['tier', 'convo', 'ai', 'agents'].forEach(key => {
    document.getElementById('lineitem-' + key).classList.remove('open');
  });
}

function renderTierCards(){
  const wrap = document.getElementById('tierCards');
  wrap.innerHTML = TIERS.map(t => `
    <div class="tier-card2 ${t.id === selectedTierId ? 'active' : ''}" onclick="selectTier('${t.id}')">
      <div class="t-left">
        <span class="t-name">${t.label}</span>
        <span class="t-includes">${fmtInt(t.convos)} convos &middot; ${fmtInt(t.aiCredits)} AI credits &middot; ${fmtInt(t.agents)} human agents</span>
      </div>
      <span class="t-price">${fmtMoney(t.price)}</span>
    </div>
  `).join('');
}

function renderConvoBuckets(){
  const stepperList = document.getElementById('stepperList');
  stepperList.innerHTML = CONVO_BUCKETS.map(b => `
    <div class="stepper-row">
      <span><span class="sr-size">${fmtInt(b.size)}</span> convos &middot; ${fmtMoney(b.price)}</span>
      <div class="stepper">
        <button type="button" onclick="stepConvo(${b.size}, -1)">&minus;</button>
        <span class="qty" id="qty-${b.size}">${convoQty[b.size]}</span>
        <button type="button" onclick="stepConvo(${b.size}, 1)">+</button>
      </div>
    </div>
  `).join('');
}

function selectTier(id){
  selectedTierId = id;
  renderTierCards();
  updateAll();
}

function stepConvo(size, dir){
  convoQty[size] = Math.max(0, convoQty[size] + dir);
  document.getElementById('qty-' + size).textContent = convoQty[size];
  updateAll();
}

function stepAgents(dir){
  agentsQty = Math.max(0, agentsQty + dir);
  document.getElementById('qty-agents').textContent = agentsQty;
  updateAll();
}

function syncAiSliderUI(){
  document.getElementById('aiSlider').value = aiIdx;
  const pct = (aiIdx / (AI_STEPS.length - 1)) * 100;
  document.getElementById('aiSlider').style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
  document.getElementById('aiSliderVal').textContent = fmtInt(AI_STEPS[aiIdx]);
}

function onAiSliderInput(){
  aiIdx = parseInt(document.getElementById('aiSlider').value, 10);

  updateAll();
}

/* ============================================================================
   UPDATE: bubble + receipt (no per-unit rate anywhere)
   ============================================================================ */
function updateAll(){
  const tier = TIERS.find(t => t.id === selectedTierId);
  const convoAdded = CONVO_BUCKETS.reduce((sum, b) => sum + b.size * convoQty[b.size], 0);
  const convoCost = CONVO_BUCKETS.reduce((sum, b) => sum + b.price * convoQty[b.size], 0);
  const aiAdded = AI_STEPS[aiIdx];
  const aiCost = AI_PRICE[aiAdded] || 0;
  const agentCost = agentsQty * AGENT_PRICE;
  const totalConvos = tier.convos + convoAdded;
  const totalAi = tier.aiCredits + aiAdded;
  const totalAgents = tier.agents + agentsQty;
  const total = tier.price + convoCost + aiCost + agentCost;

  document.getElementById('bubbleTier').textContent = tier.label + ' plan';
  document.getElementById('bubblePrice').innerHTML = fmtMoney(total) + '<span class="per">/mo</span>';
  document.getElementById('bubbleIncludes').innerHTML = `
    <li>${fmtInt(totalConvos)} conversations</li>
    <li>${fmtInt(totalAi)} AI credits</li>
    <li>${fmtInt(totalAgents)} human agents</li>
    <li class="divider"></li>
    ${STATIC_INCLUDES.map(f => `<li>${f}</li>`).join('')}
  `;

  document.getElementById('lineTierSub').textContent = `(${fmtInt(tier.convos)} convos + ${fmtInt(tier.aiCredits)} AI credits + ${fmtInt(tier.agents)} human agents included)`;
  document.getElementById('lineTierPrice').textContent = fmtMoney(tier.price);
  document.getElementById('lineConvoSub').textContent = convoAdded > 0 ? `(+${fmtInt(convoAdded)} convos)` : '(none added)';
  document.getElementById('lineConvoPrice').textContent = fmtMoney(convoCost);
  document.getElementById('lineAiSub').textContent = aiAdded > 0 ? `(+${fmtInt(aiAdded)} credits)` : '(none added)';
  document.getElementById('lineAiPrice').textContent = fmtMoney(aiCost);
  document.getElementById('lineAgentsSub').textContent = agentsQty > 0 ? `(+${fmtInt(agentsQty)} human agents)` : '(none added)';
  document.getElementById('lineAgentsPrice').textContent = fmtMoney(agentCost);
  document.getElementById('totalOut').textContent = fmtMoney(total) + '/mo';
  document.getElementById('metaNoteAmt').textContent = fmtMoney(metaCost);
}

const DEMO_COUNTRIES = Object.keys(DEMO_RATES);
const fmtMoney2 = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let rowCounter = 0;
let metaCost = 0;


function countryOptions(selected){
  return DEMO_COUNTRIES.map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`).join('');
}

function categoryOptions(country, selected){
  const entry = DEMO_RATES[country] || {};
  const cats = ['Marketing', 'Utility', 'Authentication'];
  if(entry['Authentication-International'] != null) cats.push('Authentication-International');
  cats.push('Service');
  const current = cats.includes(selected) ? selected : cats[0];
  return cats.map(c => `<option value="${c}"${c === current ? ' selected' : ''}>${c}</option>`).join('');
}

function rateFor(country, category){
  if(category === 'Service') return 0;
  const entry = DEMO_RATES[country];
  if(!entry) return 0;
  const v = entry[category];
  return v == null ? 0 : v;
}

function rowTemplate(rowId, country){
  return `
    <div class="meta-row" data-row-id="${rowId}">
      <select class="country-select" onchange="onCountryChange(this)">${countryOptions(country)}</select>
      <select class="category-select" onchange="onMetaChange()">${categoryOptions(country, 'Marketing')}</select>
      <div class="row-slider-wrap">
        <input type="range" class="conv-slider" min="0" max="100000" step="100" value="0" oninput="onMetaChange()">
        <span class="row-value">0 convs</span>
      </div>
      <span class="row-price">$0.00</span>
      <button class="row-remove" onclick="removeRow(this)">&times;</button>
    </div>`;
}

function addRow(){
  rowCounter++;
  const country = DEMO_COUNTRIES[(rowCounter - 1) % DEMO_COUNTRIES.length];
  document.getElementById('metaRows').insertAdjacentHTML('beforeend', rowTemplate(rowCounter, country));
  onMetaChange();
}

function removeRow(btn){
  btn.closest('.meta-row').remove();
  onMetaChange();
}

function onCountryChange(selectEl){
  const row = selectEl.closest('.meta-row');
  const catSelect = row.querySelector('.category-select');
  const currentCat = catSelect.value;
  catSelect.innerHTML = categoryOptions(selectEl.value, currentCat);
  onMetaChange();
}

function onMetaChange(){
  let cost = 0;
  document.querySelectorAll('#metaRows .meta-row').forEach(row => {
    const country = row.querySelector('.country-select').value;
    const category = row.querySelector('.category-select').value;
    const slider = row.querySelector('.conv-slider');
    const val = parseInt(slider.value, 10);
    const rate = rateFor(country, category);
    const rowCost = val * rate;
    row.querySelector('.row-value').textContent = fmtInt(val) + ' convs';
    row.querySelector('.row-price').textContent = '$' + fmtMoney2(rowCost);
    cost += rowCost;
  });
  metaCost = cost;
  document.getElementById('metaFeeOut').textContent = '$' + fmtMoney2(metaCost);
  document.getElementById('metaFeeTabOut').textContent = fmtMoney2(metaCost);
  updateAll();
}
